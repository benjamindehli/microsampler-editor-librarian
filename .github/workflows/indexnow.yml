name: IndexNow

# Tells the search engines that take IndexNow which docs pages changed, so
# they fetch them again now rather than whenever their crawler next comes
# round. tools/indexnow.py explains how a page counts as changed and where the
# key lives.
#
# The Pages workflow calls this once it has published the site, so nothing is
# announced before it is live. It can also be run by hand from the Actions tab.
# The same workflow the SidStation ASID repository runs.
on:
    workflow_call:
        inputs:
            ref:
                description: The commit that was published.
                type: string
                required: true
            every_page:
                description: Send every page in the sitemap, not only those whose date changed in the last day.
                type: boolean
                default: false
    workflow_dispatch:
        inputs:
            every_page:
                description: Send every page in the sitemap, not only those whose date changed in the last day.
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    notify:
        name: Notify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.sha }}
                  # Full history, to read the sitemap as it was a day ago.
                  fetch-depth: 0

            - name: Send the pages whose date changed
              env:
                  EVERY_PAGE: ${{ inputs.every_page || false }}
              run: |
                  if [ "$EVERY_PAGE" = "true" ]; then
                    python3 tools/indexnow.py --every-page
                  else
                    python3 tools/indexnow.py
                  fi
