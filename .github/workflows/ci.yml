name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# least privilege: both jobs only check out the repo and run offline tests
permissions:
    contents: read

jobs:
    tests:
        name: offline suite (python ${{ matrix.python }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # 3.8 = the oldest supported interpreter (see README); only
                    # ubuntu-22.04 still carries it
                    - { python: "3.8", os: ubuntu-22.04 }
                    - { python: "3.12", os: ubuntu-latest }
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python }}
            # the offline suite is dependency-free: pyusb/libusb are imported
            # lazily and only needed when real hardware is opened. Discovered by
            # glob (protocol.py's self-test + every test_*.py) so a new test file
            # is covered automatically — no per-file step to remember to add.
            - name: offline suite
              working-directory: src/native-tools
              run: |
                  python protocol.py
                  for t in test_*.py; do
                    echo "=== $t ==="
                    python "$t"
                  done

    frontend:
        name: frontend syntax
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
            - name: JS syntax check
              run: |
                  find src/web-editor -name '*.js' -print0 | while IFS= read -r -d '' f; do
                    echo "checking $f"
                    node --check "$f"
                  done
            - name: ES module imports resolve
              run: node --input-type=module -e "
                  import('./src/web-editor/functions/valueTables.js').then(m =>
                  console.log('valueTables:', Object.keys(m.VALUE_TABLES).length, 'tables'));
                  import('./src/web-editor/functions/fxData.js').then(m =>
                  console.log('fxData:', m.FX_TYPES.length, 'fx types'));"
            - name: unit tests (pure modules)
              run: |
                  npm ci
                  npm test

    lint:
        name: lint (ruff + eslint)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Ruff (python)
              run: |
                  pip install 'ruff==0.15.*'
                  ruff check
            - uses: actions/setup-node@v7
              with:
                  node-version: "24" # ESLint 10 needs ^20.19 || ^22.13 || >=24
                  cache: npm
            - name: ESLint (js)
              run: |
                  npm ci
                  npm run lint:js
            # JSDoc type check (tsc --checkJs, no emit). Opt-in per file via a
            # `// @ts-check` header, so this only covers the converted modules.
            - name: Types (tsc --checkJs)
              run: npm run lint:types
            - name: Prettier (format check)
              run: npm run format:check
            # the docs download link / structured data must match package.json's
            # version (npm version stamps it; this catches a manual bump that forgot)
            - name: docs version in sync
              run: node tools/stamp-docs-version.mjs --check

    e2e:
        name: e2e smoke (playwright)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Install Playwright
              run: pip install playwright
            - name: Get Playwright version
              id: pw
              run: echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"
            - uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
            - name: Install Chromium
              run: python -m playwright install --with-deps chromium # no-op download on cache hit
            # smoke.py boots the mock bridge itself, drives the app headless, and
            # fails on any page/console error or broken core interaction
            - name: Browser smoke (mock device)
              run: python test/e2e/smoke.py
