name: Release

# When a GitHub release is published, build the dist ZIP and attach it to the
# release (the release notes are written by hand).
on:
    release:
        types: [published]

permissions:
    contents: write # upload the release asset

jobs:
    package:
        name: build + attach release ZIP
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci

            # the tag goes in via env, not inline: tag names can contain shell metacharacters
            - name: Check tag matches package.json and the version is stamped
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: bash tools/check-release-tag.sh "$TAG"
            - name: Unit tests
              run: npm test

            # build dist/ and package release/<name>-v<version>.zip
            - name: Build and package
              run: npm run pack

            - name: Attach ZIP to the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.event.release.tag_name }}
              run: gh release upload "$TAG" release/*.zip --clobber
